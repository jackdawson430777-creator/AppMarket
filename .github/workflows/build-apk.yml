name: Build AppMarket APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platforms;android-37" "build-tools;37.0.0"

  - name: Make gradlew executable
    run: chmod +x gradlew

  - name: Generate temporary signing key
    run: |
      keytool -genkeypair \
        -v \
        -keystore "$GITHUB_WORKSPACE/debug.keystore" \
        -storepass android \
        -keypass android \
        -alias androiddebugkey \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US"

  - name: Build Release APK
    run: |
      ./gradlew :app:android:assembleRelease \
        -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/debug.keystore" \
        -Pandroid.injected.signing.store.password=android \
        -Pandroid.injected.signing.key.alias=androiddebugkey \
        -Pandroid.injected.signing.key.password=android \
        --stacktrace

  - name: Find APK
    run: |
      echo "Generated APK:"
      find . -type f -name "*.apk" -print

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AppMarket-release
      path: "**/build/outputs/apk/release/*.apk"
      if-no-files-found: error
      retention-days: 30